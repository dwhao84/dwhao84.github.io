site_name: Dawei Hao
site_url: https://dwhao84.github.io
site_description: iOS 工程師 · 技術部落格
site_author: 郝大緯

theme:
  name: material
  language: zh-TW
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切換深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切換淺色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    logo: material/apple
  font:
    text: Noto Sans TC
    code: Fira Code
  custom_dir: overrides

plugins:
  - search:
      lang:
        - zh
        - en
  - blog:
      blog_dir: blog
      post_date_format: yyyy/MM/dd
      categories: false
  - tags

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - tables

nav:
  - 首頁: index.md
  - 部落格:
    - blog/index.md
  - 專案: projects.md
  - 經歷: experience.md
  - 關於: about.md
  - 聯絡: contact.md

extra_css:
  - https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap
  - stylesheets/custom.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dwhao84
      name: GitHub
    - icon: fontawesome/brands/medium
      link: https://medium.com/@dwsamurai84_dev
      name: Medium
    - icon: fontawesome/solid/envelope
      link: mailto:dwsamurai84@gmail.com
      name: Email

copyright: "&copy; 2024–2026 Dawei Hao · iOS Developer from Taiwan 🇹🇼 · Built with MkDocs Material"
