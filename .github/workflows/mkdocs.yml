name: MkDocs Build & Deploy

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mkdocs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - run: pip install mkdocs-material

    - uses: actions/cache@v5
      with:
        path: .cache/apps.json
        key: app-catalog-v1-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: app-catalog-v1-

    - run: python -m unittest discover -s tests -v

    - run: python scripts/generate_index.py

    - run: python scripts/generate_projects.py

    - run: |
        git config user.name "dwhao84"
        git config user.email "100706617+dwhao84@users.noreply.github.com"
        mkdocs build --strict
        mkdocs gh-deploy --force
